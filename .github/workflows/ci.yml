name: Testen en release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/release.py
      - run: python -m unittest discover -s tests -v
      - run: python tests/http_smoke.py
      - run: node --check public/app.js
      - run: docker build -t seriesradar:test .
      - name: Start container and verify authenticated dashboard
        run: |
          docker run -d --name radar-test -e ADMIN_PASSWORD=ci-only-password -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp seriesradar:test
          python - <<'PY'
          import base64, json, time, urllib.request
          for attempt in range(20):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          token = base64.b64encode(b'admin:ci-only-password').decode()
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/dashboard'))['sources'] == []
          request = urllib.request.Request('http://127.0.0.1:8080/api/admin/dashboard', headers={'Authorization': 'Basic ' + token})
          data = json.load(urllib.request.urlopen(request, timeout=10))
          with open('sources.json', encoding='utf-8') as source_file:
              expected_sources = {s['id'] for s in json.load(source_file)}
          assert 'series' in data and {s['id'] for s in data['sources']} == expected_sources
          PY
      - if: always()
        run: docker logs radar-test || true
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versie en wijzigingsnotities controleren
        run: python .github/release.py --notes-file "$RUNNER_TEMP/seriesradar-release.md"
      - name: Release publiceren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version bestaat al."
          else
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "SeriesRadar $version" \
              --notes-file "$RUNNER_TEMP/seriesradar-release.md"
          fi
