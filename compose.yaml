services:
  seriesradar:
    build: .
    image: seriesradar:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Vul ADMIN_PASSWORD in het .env bestand in}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-1800}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - radar-data:/data
      - ./sources.json:/app/sources.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  radar-data:
